# Fails a pull request that does not close an issue (docs/CONTRIBUTING.md).
#
# `pull_request_target` runs this file from the base branch with a read-only token and never checks out the pull
# request's code, so it is safe for pull requests from forks and needs no approval to run.
name: Linked issue

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  issues: read

jobs:
  linked-issue:
    name: linked-issue
    runs-on: ubuntu-latest
    steps:
      - name: Require an issue this pull request closes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Maintainers plan their work in the repository itself and are exempt. The author's permission on the
          # repository decides it: the event's author association reports a private organization member as an
          # outside contributor. A failed lookup counts as no permission.
          permission=$(gh api "repos/$REPO_OWNER/$REPO_NAME/collaborators/$PR_AUTHOR/permission" --jq '.permission' || true)
          case "$permission" in
            admin|write)
              echo "Opened by a maintainer; no linked issue required."
              exit 0
              ;;
          esac

          # GitHub computes the closing references shortly after the description is saved, so try a few times.
          for attempt in 1 2 3; do
            count=$(gh api graphql \
              -f query='query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) { closingIssuesReferences { totalCount } }
                }
              }' \
              -f owner="$REPO_OWNER" -f name="$REPO_NAME" -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.totalCount')
            if [ "$count" -gt 0 ]; then
              echo "This pull request closes $count issue(s)."
              exit 0
            fi
            sleep 10
          done

          echo "::error::This pull request closes no issue. Open an issue first, then add 'Closes #<number>' to the description (docs/CONTRIBUTING.md)."
          exit 1
