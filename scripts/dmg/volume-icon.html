<!doctype html><meta charset="utf-8">
<!-- The icon of the mounted installer volume: an upright aluminium disk, in the manner of macOS's own disk icons,
     carrying Suijin's icon on its face. 1024 × 1024, transparent around the disk. The app icon is passed in by
     scripts/dmg/render.sh as ?icon=<file URL>. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  /* The face of the disk, seen slightly from above: it narrows a little towards the top. */
  .disk { position: absolute; left: 172px; top: 84px; width: 680px; height: 836px; filter: drop-shadow(0 0 3px rgba(20, 33, 58, 0.35)) drop-shadow(0 22px 26px rgba(0, 0, 0, 0.32)); }
  .face { position: absolute; inset: 0 0 96px 0; border-radius: 64px 64px 10px 10px; clip-path: polygon(2.5% 0, 97.5% 0, 100% 100%, 0 100%);
    background: linear-gradient(90deg, #c9ccd3 0, #eceef1 6%, #f4f5f7 50%, #eceef1 94%, #c9ccd3 100%); }
  .face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#ffffff 0, rgba(255, 255, 255, 0) 18%, rgba(0, 0, 0, 0) 60%, rgba(20, 33, 58, 0.12) 100%); }
  /* The front edge: a darker band with a rounded underside and a status light. */
  .edge { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; border-radius: 14px 14px 52px 52px / 14px 14px 52px 52px;
    background: linear-gradient(#e9eaee 0, #c9cbd2 55%, #b3b6bf 100%); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.85), inset 0 -3px 6px rgba(20, 33, 58, 0.18); }
  .edge i { position: absolute; right: 54px; top: 38px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: inset 0 2px 4px rgba(20, 33, 58, 0.35), 0 0 0 3px rgba(20, 33, 58, 0.10); }
  img { position: absolute; left: 50%; top: 150px; width: 430px; height: 430px; transform: translateX(-50%); filter: drop-shadow(0 10px 14px rgba(20, 33, 58, 0.22)); }
</style>
<div class="disk"><div class="face"></div><img id="icon" alt=""><div class="edge"><i></i></div></div>
<script>document.getElementById("icon").src = new URLSearchParams(location.search).get("icon");</script>
