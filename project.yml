name: Sevinda
options:
  bundleIdPrefix: com.tekmium
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

# Package boundaries are documented in docs/architecture.md. SwiftTerm (pinned in Packages/SevindaTerminal) ships a
# build-tool plugin, so command-line builds pass `-skipPackagePluginValidation`, and its Metal renderer needs the
# Metal Toolchain (`xcodebuild -downloadComponent metalToolchain`).
packages:
  SevindaUI:          { path: Packages/SevindaUI }
  SevindaCore:        { path: Packages/SevindaCore }
  SevindaGit:         { path: Packages/SevindaGit }
  SevindaPTYProtocol: { path: Packages/SevindaPTYProtocol }
  SevindaTerminal:    { path: Packages/SevindaTerminal }
  SevindaAgents:      { path: Packages/SevindaAgents }
  SevindaAccounts:    { path: Packages/SevindaAccounts }
  SevindaDiff:        { path: Packages/SevindaDiff }
  SevindaUsage:       { path: Packages/SevindaUsage }
  # Native SwiftUI Markdown rendering (tables, code blocks) for the file viewer tab. Pinned exactly.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  # Software updates: Sparkle 2 with EdDSA-signed updates from the appcast (docs/release-process.md). Pinned exactly;
  # an upgrade must keep `sign_update` (shipped in the package artifact) compatible with scripts/release-notarize.sh.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # TEKMIUM SOLUTIONS COMPANY LIMITED, the same team as Capstio. Command-line builds need `-allowProvisioningUpdates`.
    DEVELOPMENT_TEAM: YWSHDN5Y3H
    CODE_SIGN_STYLE: Automatic

targets:
  Sevinda:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Sevinda.entitlements"
          - "Info.plist"
          - "Resources/LaunchAgents/**"
          - "Resources/Skills/**"
      # Agent skills keep their folder layout (Contents/Resources/Skills/<skill>/SKILL.md): `sevinda skills get` reads
      # them there, and Sevinda copies them into agent homes.
      - path: App/Resources/Skills
        type: folder
        buildPhase: resources
      # launchd reads the helper's plist from Contents/Library/LaunchAgents (SMAppService.agent(plistName:)).
      - path: App/Resources/LaunchAgents/com.tekmium.sevinda.ptyhost.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: SevindaUI
      - package: SevindaCore
      - package: SevindaGit
      - package: SevindaPTYProtocol
        product: SevindaPTYProtocol
      - package: SevindaTerminal
      - package: SevindaAgents
      - package: SevindaAccounts
      - package: SevindaDiff
      - package: SevindaUsage
      - package: MarkdownUI
      - package: Sparkle
      # The PTY host ships next to the app executable (Contents/MacOS/SevindaPTYHost).
      - target: SevindaPTYHost
        embed: true
        codeSign: false
        copy:
          destination: executables
      # `sevinda` goes in its own folder (Contents/Helpers) so only it lands on the PATH of Sevinda's terminals; it
      # cannot sit in Contents/MacOS next to `Sevinda` on a case-insensitive volume.
      - target: SevindaCLI
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Sevinda
        PRODUCT_BUNDLE_IDENTIFIER: com.tekmium.sevinda
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Sevinda.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # launchd agent that owns every terminal so sessions survive the app quitting (docs/architecture.md).
  SevindaPTYHost:
    type: tool
    platform: macOS
    sources:
      - path: Helpers/SevindaPTYHost
    dependencies:
      - package: SevindaPTYProtocol
        product: SevindaPTYProtocol
      - package: SevindaPTYProtocol
        product: SevindaPTYHostKit
    settings:
      base:
        PRODUCT_NAME: SevindaPTYHost
        PRODUCT_BUNDLE_IDENTIFIER: com.tekmium.sevinda.ptyhost
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES

  # `sevinda`, the orchestration command agents run in Sevinda's terminals (docs/architecture.md). Its logic is
  # SevindaCLIKit in Packages/SevindaPTYProtocol.
  SevindaCLI:
    type: tool
    platform: macOS
    sources:
      - path: Tools/SevindaCLI
    dependencies:
      - package: SevindaPTYProtocol
        product: SevindaCLIKit
    settings:
      base:
        PRODUCT_NAME: sevinda
        # The binary is `sevinda`, but its Swift module must not be: on a case-insensitive disk `sevinda.swiftmodule`
        # and the app's `Sevinda.swiftmodule` are the same file in the build folder, and the app tests fail to load.
        PRODUCT_MODULE_NAME: SevindaCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.tekmium.sevinda.cli
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES

  # Tests hosted in the signed app, for what `swift test` cannot reach: the PTY host registered with launchd,
  # the app model driving git, terminals and accounts together, and offscreen screenshots of the windows.
  SevindaAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: Sevinda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tekmium.sevinda.apptests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sevinda.app/Contents/MacOS/Sevinda"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sevinda:
    build:
      targets:
        Sevinda: all
        SevindaAppTests: [test]
    test:
      targets:
        - SevindaAppTests
