name: Suijin
options:
  bundleIdPrefix: com.tekmium
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

# Package boundaries are documented in docs/architecture.md. SwiftTerm (pinned in Packages/SuijinTerminal) ships a
# build-tool plugin, so command-line builds pass `-skipPackagePluginValidation`, and its Metal renderer needs the
# Metal Toolchain (`xcodebuild -downloadComponent metalToolchain`).
packages:
  SuijinUI:          { path: Packages/SuijinUI }
  SuijinCore:        { path: Packages/SuijinCore }
  SuijinGit:         { path: Packages/SuijinGit }
  SuijinPTYProtocol: { path: Packages/SuijinPTYProtocol }
  SuijinTerminal:    { path: Packages/SuijinTerminal }
  SuijinAgents:      { path: Packages/SuijinAgents }
  SuijinAccounts:    { path: Packages/SuijinAccounts }
  SuijinDiff:        { path: Packages/SuijinDiff }
  SuijinUsage:       { path: Packages/SuijinUsage }
  # Native SwiftUI Markdown rendering (tables, code blocks) for the file viewer tab. Pinned exactly.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  # Software updates: Sparkle 2 with EdDSA-signed updates from the appcast (docs/release-process.md). Pinned exactly;
  # an upgrade must keep `sign_update` (shipped in the package artifact) compatible with scripts/release-notarize.sh.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # TEKMIUM SOLUTIONS COMPANY LIMITED, the same team as Capstio. Command-line builds need `-allowProvisioningUpdates`.
    DEVELOPMENT_TEAM: YWSHDN5Y3H
    CODE_SIGN_STYLE: Automatic

targets:
  Suijin:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Suijin.entitlements"
          - "Info.plist"
          - "Resources/LaunchAgents/**"
          - "Resources/Skills/**"
      # Agent skills keep their folder layout (Contents/Resources/Skills/<skill>/SKILL.md): `suijin skills get` reads
      # them there, and Suijin copies them into agent homes.
      - path: App/Resources/Skills
        type: folder
        buildPhase: resources
      # launchd reads the helper's plist from Contents/Library/LaunchAgents (SMAppService.agent(plistName:)).
      - path: App/Resources/LaunchAgents/com.tekmium.suijin.ptyhost.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: SuijinUI
      - package: SuijinCore
      - package: SuijinGit
      - package: SuijinPTYProtocol
        product: SuijinPTYProtocol
      - package: SuijinTerminal
      - package: SuijinAgents
      - package: SuijinAccounts
      - package: SuijinDiff
      - package: SuijinUsage
      - package: MarkdownUI
      - package: Sparkle
      # The PTY host ships next to the app executable (Contents/MacOS/SuijinPTYHost).
      - target: SuijinPTYHost
        embed: true
        codeSign: false
        copy:
          destination: executables
      # `suijin` goes in its own folder (Contents/Helpers) so only it lands on the PATH of Suijin's terminals; it
      # cannot sit in Contents/MacOS next to `Suijin` on a case-insensitive volume.
      - target: SuijinCLI
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Suijin
        PRODUCT_BUNDLE_IDENTIFIER: com.tekmium.suijin
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Suijin.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # launchd agent that owns every terminal so sessions survive the app quitting (docs/architecture.md).
  SuijinPTYHost:
    type: tool
    platform: macOS
    sources:
      - path: Helpers/SuijinPTYHost
    dependencies:
      - package: SuijinPTYProtocol
        product: SuijinPTYProtocol
      - package: SuijinPTYProtocol
        product: SuijinPTYHostKit
    settings:
      base:
        PRODUCT_NAME: SuijinPTYHost
        PRODUCT_BUNDLE_IDENTIFIER: com.tekmium.suijin.ptyhost
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES

  # `suijin`, the orchestration command agents run in Suijin's terminals (docs/architecture.md). Its logic is
  # SuijinCLIKit in Packages/SuijinPTYProtocol.
  SuijinCLI:
    type: tool
    platform: macOS
    sources:
      - path: Tools/SuijinCLI
    dependencies:
      - package: SuijinPTYProtocol
        product: SuijinCLIKit
    settings:
      base:
        PRODUCT_NAME: suijin
        # The binary is `suijin`, but its Swift module must not be: on a case-insensitive disk `suijin.swiftmodule`
        # and the app's `Suijin.swiftmodule` are the same file in the build folder, and the app tests fail to load.
        PRODUCT_MODULE_NAME: SuijinCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.tekmium.suijin.cli
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES

  # Tests hosted in the signed app, for what `swift test` cannot reach: the PTY host registered with launchd,
  # the app model driving git, terminals and accounts together, and offscreen screenshots of the windows.
  SuijinAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: Suijin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tekmium.suijin.apptests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Suijin.app/Contents/MacOS/Suijin"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Suijin:
    build:
      targets:
        Suijin: all
        SuijinAppTests: [test]
    test:
      targets:
        - SuijinAppTests
