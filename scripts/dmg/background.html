<!doctype html><meta charset="utf-8">
<!-- The picture behind the icons in the installer window: 660 × 400 points. The app's icon sits at (180, 185) and
     the Applications shortcut at (480, 185); scripts/make-dmg.sh places them. Rendered by scripts/dmg/render.sh. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 660px; height: 400px; overflow: hidden; position: relative; background: #f2efe7; color: #14213a;
    font-family: "SF Pro Display", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; left: 180px; top: 185px; width: 520px; height: 520px; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(109, 131, 168, 0.26), rgba(109, 131, 168, 0)); }
  .ring { position: absolute; left: 180px; top: 185px; transform: translate(-50%, -50%); border-radius: 50%; border: 1.2px solid rgba(19, 48, 94, 0.10); }
  h1 { position: absolute; left: 0; right: 0; top: 28px; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  /* Kept near the top: Finder's path bar, when shown, covers the bottom of the picture. */
  p { position: absolute; left: 0; right: 0; top: 60px; text-align: center; font-size: 12.5px; color: #5b6579; }
  svg { position: absolute; left: 270px; top: 161px; width: 120px; height: 48px; }
</style>
<div class="glow"></div>
<div class="ring" style="width:190px;height:190px"></div>
<div class="ring" style="width:300px;height:300px;border-color:rgba(19,48,94,.07)"></div>
<div class="ring" style="width:430px;height:430px;border-color:rgba(19,48,94,.045)"></div>
<h1>Drag Suijin to Applications</h1>
<svg viewBox="0 0 120 48" fill="none" stroke="#13305e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10 24 C 34 10, 62 34, 104 24" opacity=".8"/><path d="M92 14 L106 24 L93 35" opacity=".8"/>
</svg>
<p>Many agents, one calm window.</p>
